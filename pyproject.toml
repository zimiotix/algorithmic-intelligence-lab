[project]
name = "ailab"
version = "0.1.0"
description = "Algorithmic Intelligence Lab: a native Linux platform for learning deterministic intelligent algorithms by playing with them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "warp-lang>=1.5",       # GPU (CUDA) kernels with a CPU fallback from the same source
    "PySide6-Essentials>=6.8",  # native Qt 6 UI (Core/Gui/Widgets/OpenGL/Svg only - no 170MB add-ons)
    "moderngl>=5.10",       # OpenGL renderer used inside the Qt viewport
    "markdown-it-py>=3.0",  # chapter text -> rich text
    "sympy>=1.13",          # exact, symbolic math (derivations + tests)
    "ziamath>=0.13",
]

[project.optional-dependencies]
# Offline explainer animations for the Advanced sections (Manim Community Edition).
media = ["manim>=0.19"]

[project.scripts]
ailab = "ailab.__main__:main"

[project.gui-scripts]
ailab-gui = "ailab.__main__:main"   # Windows: launches without a console window

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ailab"]

[tool.pytest.ini_options]
testpaths = ["tests", "chapters"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "UP018"]  # UP018 would turn Warp's float(0.0) into 0.0, which Warp rejects in loops
