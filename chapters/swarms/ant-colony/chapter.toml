title = "Ant Colony: Memory in the Dirt"
order = 20
summary = "No ant knows the way, yet the colony finds the shortest path. Build walls, place food, watch them adapt."
difficulty = 2
tags = ["stigmergy", "pheromones", "shortest path", "double bridge"]
compute = "gpu"
memory = ["environmental", "working"]
prerequisites = ["swarms.fish-school"]
controls = [
  ["Wall (1)", "Left drag builds, right drag erases"],
  ["Food (2)", "Left click drops a pile, right click removes food"],
  ["Rich food (3)", "Left click drops rich food (gold), right click removes food"],
  ["Inspect (4)", "Click an ant to follow its sensors"],
]
reality = """
There are more than 14,000 ant species and they forage very differently. Many use several
pheromones, some recruit nest-mates by leading them one by one (tandem running), some
navigate mostly by sight and sun (desert ants), and crowding itself can change what ants
do. Here there are two attractive trails and one "no entry" repellent, a log-scale nose,
and ants that differ only in speed, wander, trail loyalty and which side they keep a wall
on. Real Pharaoh's ants do use a "no entry" signal, Lasius niger workers do mark richer
food more strongly, and real ants do follow walls (thigmotaxis), but our triggers, feelers
and numbers are simplified. The navigator ants' "am I circling?" rule and their Bug
algorithm (borrowed from robotics) are this Lab's inventions: real army ants caught in a
mill can circle until they die.
"""

[glossary]
'c(\mathbf{x}, t)' = "Pheromone concentration at place x and time t"
'\nabla^2 c' = "How much c differs from its surroundings; diffusion evens it out"
'\delta(\mathbf{x} - \mathbf{x}_k)' = "A deposit exactly at ant k's position"
't_a' = "Time since the ant left the nest or found food"
'S_L,\, S_F,\, S_R' = "Readings of the left, front and right smell sensors"
'\sigma_{turn}' = "The turn decision: +1 left, 0 straight, -1 right"
'\theta,\; \theta_{nest}' = "The ant's heading, and the direction of the nest from it"
'\xi' = "A random number between -1 and 1 (seeded: the same every run)"
'A,\, B,\, P_A' = "Ants that used branch A and B so far, and the chance the next one picks A"
'W' = "How far an ant has turned lately, in radians; old turning fades away"
'n' = "No-entry marks: the repellent laid by frustrated searchers"
'Q' = "Quality of the food an ant carries: 1 for ordinary food, higher for rich food"
't_{lost}' = "Time since an ant last reached home or food, not counting time along walls"
'v_i,\; \sigma_i,\; f_i' = "Ant i's own speed, wander, and trail loyalty (its personality)"
'z_1,\, z_2,\, z_3' = "Ant i's three random draws from a standard normal, fixed at birth"
's_i' = "Ant i's wall side: +1 keeps walls on its left, -1 on its right"
'd_{hit}' = "A navigator's distance from home when it met the wall it is following"
'\mathbf{x},\; \mathbf{x}_{nest}' = "An ant's position, and the nest's"
'\hat{\mathbf{u}}(\phi)' = "The unit vector pointing at angle phi"
'k,\, n' = "Choice-model constants: how big an early lead must be, and how sharply it's amplified"
